  <text x="94" y="222" fill="#dcddde" font-size="14">Voice #1</text>

  <!-- Voice Users with green ring -->
  <circle cx="112" cy="252" r="12" fill="#5865f2" stroke="#43b581" stroke-width="2"/>
  <text x="132" y="256" fill="#ffffff" font-size="13" font-weight="500">Roskud</text>
  <circle cx="112" cy="284" r="12" fill="#747f8d"/>
  <text x="132" y="288" fill="#8e9297" font-size="13">Player</text>

  <!-- User Dock (#292b2f) -->
  <rect x="72" y="716" width="240" height="52" fill="#292b2f"/>
  <circle cx="96" cy="742" r="16" fill="#5865f2"/>
  <circle cx="107" cy="753" r="5" fill="#3ba55c" stroke="#292b2f" stroke-width="2"/>
