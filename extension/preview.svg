  <!-- Chat Input (#40444b) -->
  <rect x="328" y="704" width="680" height="44" rx="8" fill="#40444b"/>
  <circle cx="352" cy="726" r="11" fill="#b9bbbe"/>
  <text x="374" y="731" fill="#72767d" font-size="14">Message #general</text>
