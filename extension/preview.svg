  <rect x="944" y="11" width="10" height="2" fill="#b9bbbe"/>
  <rect x="968" y="6" width="10" height="10" fill="none" stroke="#b9bbbe" stroke-width="1.5"/>
  <path d="M992 6 L1002 16 M1002 6 L992 16" stroke="#b9bbbe" stroke-width="1.5"/>

  <!-- Far Left Guild Rail (#202225) -->
  <rect x="0" y="24" width="72" height="744" fill="#202225"/>
  <rect x="12" y="34" width="48" height="48" rx="16" fill="#5865f2"/>
  <circle cx="36" cy="58" r="13" fill="#ffffff"/>
  <rect x="20" y="92" width="32" height="2" rx="1" fill="#36393f"/>
  <rect x="0" y="108" width="4" height="40" rx="2" fill="#ffffff"/>
