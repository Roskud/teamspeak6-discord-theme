  <text x="120" y="754" fill="#b9bbbe" font-size="11">Online</text>

  <!-- Main Chat Area (#36393f) -->
  <rect x="312" y="24" width="712" height="744" fill="#36393f"/>
  <rect x="312" y="24" width="712" height="48" fill="#36393f"/>
