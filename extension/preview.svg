  <!-- Flat Discord Chat Messages (no bubbles) -->
  <circle cx="348" cy="112" r="20" fill="#5865f2"/>
  <text x="380" y="106" fill="#ffffff" font-size="14" font-weight="600">Roskud</text>
  <text x="438" y="106" fill="#72767d" font-size="11">Today at 22:30</text>
  <text x="380" y="126" fill="#dcddde" font-size="14">Discord Classic Dark theme for TeamSpeak 6</text>

  <circle cx="348" cy="176" r="20" fill="#3ba55c"/>
  <text x="380" y="170" fill="#ffffff" font-size="14" font-weight="600">Friend</text>
